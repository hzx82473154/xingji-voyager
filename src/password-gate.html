<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050c13">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="星际 Voyager · 受邀探索宇宙">
<title>星际 Voyager · 访问密码</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='18' fill='%238ecdc3'/%3E%3Cellipse cx='32' cy='32' rx='29' ry='9' fill='none' stroke='%238ecdc3' stroke-width='3' transform='rotate(-30 32 32)'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 20px;background:#050c13;color:#e4efed;font:16px/1.65 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,#16423855,transparent 55%),radial-gradient(circle at 22% 19%,#bcebe0 0 1px,transparent 2px),radial-gradient(circle at 82% 32%,#94b4d5 0 1px,transparent 2px),radial-gradient(circle at 75% 76%,#bcebe0 0 1px,transparent 2px),radial-gradient(circle at 15% 68%,#7fa9ba 0 1px,transparent 2px)}main{position:relative;width:min(100%,430px);padding:38px 30px 30px;background:#071119d9;border:1px solid #93cdb82b;border-radius:22px;box-shadow:0 24px 80px #0005}.planet{display:block;width:65px;height:65px;margin:0 auto 20px;fill:none;stroke:#8ecdc3;stroke-width:1.6}.eyebrow{text-align:center;letter-spacing:.22em;color:#86b4ac;font-size:11px}h1{text-align:center;font-size:28px;font-weight:500;margin:10px 0 8px}h1 span{font-weight:300;color:#a3d6c9}.intro{text-align:center;color:#9caeb8;font-size:14px;margin:0 0 29px}label{font-size:13px;color:#b9cecf;display:block;margin-bottom:8px}.field{display:flex;gap:5px;align-items:center;border:1px solid #93b7bc55;border-radius:11px;background:#02080d;padding:2px 5px 2px 0}.field:focus-within{border-color:#8ecdc3;box-shadow:0 0 0 3px #8ecdc31c}input{width:100%;min-width:0;padding:13px 14px;font:inherit;font-size:16px;letter-spacing:.03em;background:transparent;color:#e4efed;border:0;outline:0}button{font:inherit;cursor:pointer;border:0}#reveal{flex:none;padding:10px;color:#93b9b1;background:transparent;font-size:13px;border-radius:7px}#unlock{width:100%;margin-top:17px;padding:13px 16px;border-radius:11px;background:#92cfc0;color:#06261e;font-weight:600;transition:background .15s}#unlock:hover{background:#b3e7db}button:focus-visible{outline:2px solid #d8fff1;outline-offset:3px}button:disabled{cursor:wait;opacity:.6}#message{min-height:24px;font-size:13px;margin:14px 0 0;color:#9ebeb7;text-align:center;overflow-wrap:anywhere}#message.error{color:#f0b7a7}progress{display:block;width:100%;height:5px;margin-top:16px;accent-color:#92cfc0}progress[hidden]{display:none}.note{text-align:center;font-size:12px;color:#708c91;margin:25px 0 0}noscript{display:block;color:#f0b7a7;text-align:center;font-size:14px;margin-top:16px}@media(max-width:420px){main{padding:30px 23px}h1{font-size:26px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main aria-labelledby="title">
<svg class="planet" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="19"/><ellipse cx="40" cy="40" rx="36" ry="12" transform="rotate(-35 40 40)"/></svg>
<div class="eyebrow">INTERSTELLAR EXPLORER</div>
<h1 id="title">星际 <span>Voyager</span></h1>
<p class="intro">输入访问密码，开始探索。</p>
<form id="unlock-form">
<label for="password">访问密码</label>
<div class="field"><input id="password" type="password" autocomplete="off" spellcheck="false" autocapitalize="none" autofocus maxlength="256" aria-describedby="message"><button type="button" id="reveal" aria-pressed="false" aria-controls="password">显示</button></div>
<button type="submit" id="unlock">进入宇宙 <span aria-hidden="true">↗</span></button>
<p id="message" role="status" aria-live="polite"></p>
<progress id="progress" max="100" value="0" aria-label="准备进度" hidden></progress>
</form>
<p class="note">请向分享链接的人获取密码。</p>
<noscript>请开启 JavaScript 后输入密码。</noscript>
</main>
<script type="application/json" id="gate-data">/*GATE_DATA*/</script>
/*GATE_PAYLOAD*/
<script>/*GATE_SCRIPT*/</script>
</body>
</html>
