name: Publish Voyager to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voyager-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check program syntax
        run: npm run check

      - name: Build and verify both editions
        env:
          VOYAGER_ACCESS_PASSWORD: ${{ secrets.VOYAGER_ACCESS_PASSWORD }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          password = os.environ.pop('VOYAGER_ACCESS_PASSWORD', '')
          if not 6 <= len(password) <= 256:
              sys.exit('Set VOYAGER_ACCESS_PASSWORD to a 6-256 character website password in repository Secrets.')
          request = json.dumps({'password': password}) + '\n'
          for script in ['build.mjs', 'validation/protected-v23.test.mjs', 'validation/production-startup.test.mjs']:
              subprocess.run(['node', script], input=request, text=True, check=True)
          password = request = ''
          PY

      - name: Upload built website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
